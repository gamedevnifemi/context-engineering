[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxeng"
version = "0.1.0"
description = "Diagnostics for how Claude Code sessions consume their context window and what compaction costs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
charts = ["matplotlib>=3.7"]
dev = ["pytest>=8"]

[project.scripts]
ctxeng = "ctxeng.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
